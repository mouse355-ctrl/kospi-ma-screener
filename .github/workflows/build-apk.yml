name: Build APK

# 안드로이드 APK 를 GitHub 가 대신 빌드해 Releases 에 올립니다.
# PC 나 Android Studio 없이도 폰에서 바로 내려받아 설치할 수 있습니다.
#   다운로드 주소(항상 최신):
#   https://github.com/<아이디>/<저장소>/releases/latest/download/kospi-screener.apk

on:
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:                  # 앱 코드가 바뀌면 자동 빌드
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write           # Releases 에 APK 를 올리기 위해 필요

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 서명 키를 고정해 두면 기존 앱 위에 덮어쓰기 설치가 됩니다.
      # (비워 두면 매번 다른 임시 키로 서명되어, 설치 전에 기존 앱을 지워야 합니다.)
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "고정 서명 키 적용됨"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 시크릿이 없어 임시 키로 서명합니다. 설치 전 기존 앱을 삭제해야 합니다."
          fi

      - name: Build APK
        working-directory: android
        env:
          # 앱에 데이터 주소를 미리 넣어 둡니다 (앱에서 따로 입력할 필요 없음)
          DATA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/docs/data
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kospi-screener.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="빌드 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') · 커밋 ${GITHUB_SHA:0:7}"
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest --title "KOSPI 정배열 스크리너 APK" --notes "$NOTE"
          gh release edit apk-latest --notes "$NOTE"
          gh release upload apk-latest kospi-screener.apk --clobber
          echo "다운로드: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/kospi-screener.apk"

      # 테스트 결과를 남겨 두면 실패 원인을 보기 쉽습니다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
