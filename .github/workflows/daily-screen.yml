name: Daily KOSPI MA screen

on:
  schedule:
    # 평일 16:30 KST (= 07:30 UTC). KRX 장 마감(15:30) 후 일봉 확정 여유 포함.
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "처리 종목 수 제한 (0 = 전체)"
        default: "0"

permissions:
  contents: write   # 결과 JSON 을 저장소에 commit/push 하기 위해 필요

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: server

      - name: Run screener
        working-directory: server
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'auto' }}
          EXCLUDE_PREFERRED: ${{ vars.EXCLUDE_PREFERRED || 'true' }}
          WORKERS: "6"
        run: python -m screener.main --limit "${{ inputs.limit || '0' }}" --out-dir ../docs/data

      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "screen: $(date -u +%Y-%m-%d) results"
            git push
          fi
